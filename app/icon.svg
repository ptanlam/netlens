<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!--
    "Allocation ring" (direction 1c of the Netlens app icon, claude.ai/design): the
    dashboard's allocation donut — ink, Wise Green, grey — with an upward trend inside it.

    The ring is one r=140 circle drawn three times, each stroke dashed to its own arc
    (circumference ≈ 879.6, 24-unit gaps), rotated so the first arc starts at twelve o'clock.
    `apple-icon.png` is this same drawing, full-bleed: see the note in `app/manifest.ts`.
  -->
  <rect width="512" height="512" rx="116" fill="#ffffff" />
  <g transform="rotate(-90 256 256)" fill="none" stroke-width="64">
    <circle cx="256" cy="256" r="140" stroke="#0e0f0c" stroke-dasharray="310 569.6" stroke-dashoffset="0" />
    <circle cx="256" cy="256" r="140" stroke="#9fe870" stroke-dasharray="266 613.6" stroke-dashoffset="-334" />
    <circle cx="256" cy="256" r="140" stroke="#868685" stroke-dasharray="231 648.6" stroke-dashoffset="-624" />
  </g>
  <g fill="none" stroke="#0e0f0c" stroke-width="26" stroke-linecap="round" stroke-linejoin="round">
    <path d="M204 300 L244 260 L270 280 L310 232" />
    <path d="M280 228 L314 228 L314 262" />
  </g>
</svg>
