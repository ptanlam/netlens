<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!--
    The brand mark as the side rail draws it (`BrandMark` in `components/nav.tsx`): a Wise
    Green disc with a Figtree 900 "N" in the deep green that sits on primary everywhere else.

    The N is an outline rather than a <text> element: a favicon is rendered outside the page,
    so Figtree isn't loaded and <text> would fall back to whatever sans the OS has. The path
    is Figtree Black's own N, traced with fontTools and set at 0.6 of the tile so it still
    reads at 16px, then centred on its ink box rather than its advance width.
  -->
  <circle cx="32" cy="32" r="32" fill="#9fe870" />
  <path fill="#163300" d="M19.46 45.44V18.56H26.95L37.43 33.34V18.56H44.54V45.44H37.43L26.57 30.12V45.44Z" />
</svg>
